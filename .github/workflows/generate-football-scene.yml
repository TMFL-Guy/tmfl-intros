name: Generate TMFL Football CGI
on:
  workflow_dispatch:
    inputs:
      scene_duration:
        description: 'Clip duration in seconds (0.5 to 4.5)'
        required: true
        default: '3.5'
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Animate football rising and spinning
        env:
          INPUT_IMAGE_URL: https://raw.githubusercontent.com/TMFL-Guy/tmfl-intros/main/assets/03fe4f69-c7e6-4410-9a13-0b5a954d71c1.png
          INPUT_DURATION: ${{ inputs.scene_duration }}
          INPUT_PROMPT: 'Professional cinematic American football broadcast intro. The brown TMFL football in the foreground slowly lifts from the turf and rotates smoothly in midair, laces and TMFL logo visible as it spins. Camera makes a subtle cinematic forward push. Preserve the exact miniature TeenyMates stadium background, cardboard stands, tiny crowd, central goalpost, attached floodlights, signs, moonlit sky and yard lines. Do not change or reconstruct the stadium. No new objects or overlays, smooth physically plausible motion, silent video, 16:9 landscape.'
          MAX_INPUT_WIDTH: '832'
          MAX_INPUT_HEIGHT: '468'
        run: python scripts/generate_wan_clip.py
      - name: Upload CGI video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TMFL-Football-Scene-CGI
          path: |
            output/*.mp4
            output/status.txt
          if-no-files-found: warn
          retention-days: 7
