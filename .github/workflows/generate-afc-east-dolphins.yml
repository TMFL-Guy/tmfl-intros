name: Generate Miami Dolphins Drowned Stadium
on:
  workflow_dispatch:
    inputs:
      scene_duration:
        description: Clip duration in seconds (0.5 to 4.5)
        required: true
        default: '4.0'
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Animate CGI
        env:
          INPUT_IMAGE_URL: https://raw.githubusercontent.com/TMFL-Guy/tmfl-intros/main/assets/dolphins.png
          INPUT_DURATION: ${{ inputs.scene_duration }}
          INPUT_PROMPT: 'Epic cinematic 16:9 underwater image-to-video sequence. Preserve the submerged Dolphins stadium and all original architecture. Slow underwater tracking camera through teal water; suspended particles drift, fish move in the distance, rays of sunlight ripple, Dolphins banners sway gently, and bubbles rise past the sunken helmet. No giant dolphin, no stadium reconstruction, no logo distortion.'
        run: python scripts/generate_wan_clip.py
      - name: Upload MP4 or status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TMFL-AFC-East-dolphins-CGI
          path: |
            output/*.mp4
            output/status.txt
          if-no-files-found: warn
          retention-days: 7
