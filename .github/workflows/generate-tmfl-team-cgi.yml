name: TMFL Team CGI Generator
on:
  workflow_dispatch:
    inputs:
      teams:
        description: Which teams to render
        required: true
        type: choice
        default: All teams
        options:
          - All teams
          - Cincinnati Bengals only
          - AFC South only
          - AFC West only
          - NFC East only
          - NFC South only
      scene_duration:
        description: Clip duration in seconds (0.5 to 4.5)
        required: true
        default: '4.0'
        type: string
jobs:
  render:
    name: Animate ${{ matrix.team }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - team: Buffalo Bills
            file: assets/bills.png
            id: bills
          - team: Miami Dolphins
            file: assets/dolphins.png
            id: dolphins
          - team: New England Patriots
            file: assets/pats.png
            id: patriots
          - team: New York Jets
            file: assets/jets.png
            id: jets
          - team: Cincinnati Bengals
            file: assets/bengals.png
            id: bengals
          - team: Cleveland Browns
            file: assets/browns.png
            id: browns
          - team: Pittsburgh Steelers
            file: assets/steelers.png
            id: steelers
          - team: Houston Texans
            file: assets/texans.png
            id: texans
          - team: Indianapolis Colts
            file: assets/colts.png
            id: colts
          - team: Jacksonville Jaguars
            file: assets/jags.png
            id: jaguars
          - team: Denver Broncos
            file: assets/broncos.png
            id: broncos
          - team: Kansas City Chiefs
            file: assets/chiefs.png
            id: chiefs
          - team: Las Vegas Raiders
            file: assets/raiders.png
            id: raiders
          - team: Los Angeles Chargers
            file: assets/chargers.png
            id: chargers
          - team: Dallas Cowboys
            file: assets/cowboys.png
            id: cowboys
          - team: New York Giants
            file: assets/giants.png
            id: giants
          - team: Philadelphia Eagles
            file: assets/eagles.png
            id: eagles
          - team: Washington Commanders
            file: assets/commanders.png
            id: commanders
          - team: Atlanta Falcons
            file: assets/falcons.png
            id: falcons
          - team: Carolina Panthers
            file: assets/panthers.png
            id: panthers
          - team: New Orleans Saints
            file: assets/saints.png
            id: saints
          - team: Tampa Bay Buccaneers
            file: assets/bucs.png
            id: buccaneers
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.teams == 'All teams' || (inputs.teams == 'Cincinnati Bengals only' && matrix.id == 'bengals') || (inputs.teams == 'AFC South only' && (matrix.id == 'texans' || matrix.id == 'colts' || matrix.id == 'jaguars')) || (inputs.teams == 'AFC West only' && (matrix.id == 'broncos' || matrix.id == 'chiefs' || matrix.id == 'raiders' || matrix.id == 'chargers')) || (inputs.teams == 'NFC East only' && (matrix.id == 'cowboys' || matrix.id == 'giants' || matrix.id == 'eagles' || matrix.id == 'commanders')) || (inputs.teams == 'NFC South only' && (matrix.id == 'falcons' || matrix.id == 'panthers' || matrix.id == 'saints' || matrix.id == 'buccaneers')) }}
      - uses: actions/setup-python@v5
        if: ${{ inputs.teams == 'All teams' || (inputs.teams == 'Cincinnati Bengals only' && matrix.id == 'bengals') || (inputs.teams == 'AFC South only' && (matrix.id == 'texans' || matrix.id == 'colts' || matrix.id == 'jaguars')) || (inputs.teams == 'AFC West only' && (matrix.id == 'broncos' || matrix.id == 'chiefs' || matrix.id == 'raiders' || matrix.id == 'chargers')) || (inputs.teams == 'NFC East only' && (matrix.id == 'cowboys' || matrix.id == 'giants' || matrix.id == 'eagles' || matrix.id == 'commanders')) || (inputs.teams == 'NFC South only' && (matrix.id == 'falcons' || matrix.id == 'panthers' || matrix.id == 'saints' || matrix.id == 'buccaneers')) }}
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: ${{ inputs.teams == 'All teams' || (inputs.teams == 'Cincinnati Bengals only' && matrix.id == 'bengals') || (inputs.teams == 'AFC South only' && (matrix.id == 'texans' || matrix.id == 'colts' || matrix.id == 'jaguars')) || (inputs.teams == 'AFC West only' && (matrix.id == 'broncos' || matrix.id == 'chiefs' || matrix.id == 'raiders' || matrix.id == 'chargers')) || (inputs.teams == 'NFC East only' && (matrix.id == 'cowboys' || matrix.id == 'giants' || matrix.id == 'eagles' || matrix.id == 'commanders')) || (inputs.teams == 'NFC South only' && (matrix.id == 'falcons' || matrix.id == 'panthers' || matrix.id == 'saints' || matrix.id == 'buccaneers')) }}
        run: |
          python -m pip install requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Animate team CGI
        if: ${{ inputs.teams == 'All teams' || (inputs.teams == 'Cincinnati Bengals only' && matrix.id == 'bengals') || (inputs.teams == 'AFC South only' && (matrix.id == 'texans' || matrix.id == 'colts' || matrix.id == 'jaguars')) || (inputs.teams == 'AFC West only' && (matrix.id == 'broncos' || matrix.id == 'chiefs' || matrix.id == 'raiders' || matrix.id == 'chargers')) || (inputs.teams == 'NFC East only' && (matrix.id == 'cowboys' || matrix.id == 'giants' || matrix.id == 'eagles' || matrix.id == 'commanders')) || (inputs.teams == 'NFC South only' && (matrix.id == 'falcons' || matrix.id == 'panthers' || matrix.id == 'saints' || matrix.id == 'buccaneers')) }}
        env:
          SELECTED_TEAM: ${{ matrix.team }}
          INPUT_IMAGE_URL: https://raw.githubusercontent.com/TMFL-Guy/tmfl-intros/main/${{ matrix.file }}
          INPUT_DURATION: ${{ inputs.scene_duration }}
        shell: bash
        run: |
          case "$SELECTED_TEAM" in
            "Buffalo Bills")
              prompt="Epic cinematic 16:9 Buffalo Bills CGI. Preserve the source image. The spectral icy buffalo shifts through a fierce blizzard, snow and frost swirling in layered depth, stadium lights pulsing through mist. Slow low-angle camera push, subtle parallax. Preserve logos, helmet, and scene geometry."
              ;;
            "Miami Dolphins")
              prompt="Epic cinematic 16:9 Miami Dolphins underwater CGI. Preserve the submerged stadium. Slow underwater tracking shot, suspended particles drift, fish move in distance, rays ripple, Dolphins banners sway and bubbles rise past the sunken helmet. No giant dolphin. Preserve logos and architecture."
              ;;
            "New England Patriots")
              prompt="Epic cinematic 16:9 Patriots colonial battlefield CGI. Preserve flags, fort, cannon, lantern and ghostly silhouettes. Camera creeps past the lantern toward the fort, fog rolls over ground, banners flutter, torches flicker. No combat or weapon discharge. Preserve logos."
              ;;
            "Cincinnati Bengals")
              prompt="Cinematic 16:9 slow camera push toward a Bengal tiger overlooking Cincinnati at sunset. The tiger breathes and blinks; river reflections shimmer and smoke drifts. Preserve the original image and lettering."
              ;;
            "Cleveland Browns")
              prompt="Epic cinematic 16:9 Cleveland Browns CGI. Preserve the furious bulldog with its metal spiked collar and the wooden DAWG POUND fence. The bulldog snarls, chest rises, head subtly lunges toward camera while thick white and orange paint visibly drips downward from the DAWG POUND letters along the wood planks. Low camera push, sparks and orange stadium light flicker. Keep text legible, no added dogs or distorted anatomy."
              ;;
            "Pittsburgh Steelers")
              prompt="Epic cinematic 16:9 Pittsburgh Steelers CGI. Preserve Steelers helmet in foreground, Pittsburgh skyline, yellow bridges, industrial steel beams and metallic STEELERS lettering. Camera glides slowly past the rain-speckled helmet; hot steel sparks fall from the overhead girders, golden light pulses across wet rivets, reflections shimmer in the river. Keep logos and typography unchanged; no new players or helmets."
              ;;
            "Houston Texans")
              prompt="Cinematic 16:9 Houston Texans CGI. Preserve the uploaded source artwork, especially the Texans bull with the team logo forming its face and the stadium-free background. Bull shifts its head and exhales a short plume of vapor; subtle dust and dramatic directional light sweep across the logo. Slow orbiting camera with strong depth. No stadium, no new animals, no morphing or logo distortion."
              ;;
            "Indianapolis Colts")
              prompt="Cinematic 16:9 Indianapolis Colts CGI. Preserve the actual source scene: rain-darkened stadium tunnel, horseshoe on concrete wall, Colts helmet and gear case on the right, distant stadium lights. Ground-level camera creeps forward through the tunnel toward the glowing stadium entrance. Water droplets roll down the helmet, reflections ripple across the floor and distant lights flicker softly. No horse appears. No new objects or typography changes."
              ;;
            "Jacksonville Jaguars")
              prompt="Cinematic 16:9 Jacksonville Jaguars CGI. Preserve the source image of the dark flooded research corridor with mysterious teal jaguar eyes and damaged glass. Camera tracks inches above the water; small ripples spread toward camera, lights flicker and the shadow of a jaguar passes across the far wall. Suspenseful atmospheric movement, no giant mascot, no added text or distorted geometry."
              ;;
            "Denver Broncos")
              prompt="Epic cinematic 16:9 Denver Broncos CGI. Preserve original snowy Rocky Mountain herd artwork and the Broncos logo. A whole herd of white-coated horses with orange manes and tails gallops powerfully across the snow-covered slope, hooves kicking up swirling snow, orange manes whipping in alpine wind. Dynamic low tracking camera follows herd. Keep horses anatomically natural, preserve logo, no words added."
              ;;
            "Kansas City Chiefs")
              prompt="Cinematic 16:9 Kansas City Chiefs CGI. Preserve the uploaded image of a respectful historical Plains council gathered by a campfire among tipis and the Chiefs KC arrowhead logo. Warm flames dance, embers drift upward, tipi canvas shifts gently in evening breeze, subtle camera dolly through the scene. Keep people stable and natural, no invented rituals, no logo deformation."
              ;;
            "Las Vegas Raiders")
              prompt="Cinematic black-white-silver Las Vegas Raiders CGI. Preserve the shield with the RAIDERS wordmark at its top, armored raider, distant marching figures, flag and moonlit Las Vegas skyline. Slow dramatic camera sweep over jagged rocks as the cape and banner billow, silver moonlight sweeps across armor and clouds roll. No combat, no extra weapons, preserve readable RAIDERS lettering."
              ;;
            "Los Angeles Chargers")
              prompt="Epic cinematic 16:9 Los Angeles Chargers coastal storm CGI. Preserve the large yellow and blue lightning bolt logo, lighthouse, cliffs, palm trees and sunset ocean. Huge ocean waves crash into the cliffs, throwing white spray upward; vivid electric-blue lightning flashes and strikes in the sky behind the bolt logo, briefly lighting the entire coastline. Lighthouse beam sweeps through rain and sea mist, dynamic cinematic camera. Keep the logo intact and legible."
              ;;
            "Dallas Cowboys")
              prompt="Cinematic 16:9 Dallas Cowboys rodeo CGI. Preserve the original sunset rodeo arena, cowboy on horseback, dusty ground, Texas flags, windmill and Cowboys star. The horse surges forward through a plume of dust, its mane whipping as the camera tracks low alongside. Flags ripple in the wind and golden light catches the airborne dust. Preserve anatomy and all branding."
              ;;
            "New York Giants")
              prompt="Epic cinematic 16:9 New York Giants CGI. Preserve the colossal weathered stone giant looming above Manhattan, its glowing blue eyes and cracks, enormous reaching hand, NY emblem and Empire State Building. The giant slowly leans toward camera and extends its massive hand while dust and mist swirl between skyscrapers. Dramatic low-angle camera push, realistic stone texture, stable city geometry, no extra giants or logo distortion."
              ;;
            "Philadelphia Eagles")
              prompt="Cinematic 16:9 Philadelphia Eagles CGI. Preserve the giant bald eagle with wings spread over the Philadelphia skyline and original Eagles branding. Eagle sweeps powerfully across frame with natural wing motion, feathers ripple in the wind and city lights glint below. Dynamic aerial camera tracking, realistic anatomy, no added birds or logo distortion."
              ;;
            "Washington Commanders")
              prompt="Cinematic 16:9 Top Gun-style Washington Commanders briefing room CGI. Preserve the commander in burgundy flight suit at the center, surrounding seated pilots, burgundy-and-gold W helmet, mission folder and illuminated Washington map. Commander leans forward and gestures emphatically to the pilots; one pilot subtly turns to listen. Low dramatic camera push toward the commander, soft screen glow and reflections flicker. Preserve faces, hands, W insignia and text; no new objects, no combat."
              ;;
            "Atlanta Falcons")
              prompt="Cinematic 16:9 Atlanta Falcons CGI. Preserve the source image of a black and crimson peregrine falcon diving head-on through thick vapor clouds. The falcon hurtles toward the camera, wings tucked, while white condensation streams around its shoulders and feathers, clouds rush past in layered depth, and red light pulses subtly through the mist. Strong forward speed, natural bird anatomy, no additional birds, no logo or text added."
              ;;
            "Carolina Panthers")
              prompt="Cinematic 16:9 Carolina Panthers CGI. Preserve the source image of the black panther lunging from a moonlit blue forest canopy toward the viewer. Animate a short powerful forward pounce with subtle forepaw movement, rippling fur and leaves scattering around the cat. Moonlight glints in its icy blue eyes; dynamic camera pullback and atmospheric mist. Preserve feline anatomy, no extra limbs, no additional animals or text."
              ;;
            "New Orleans Saints")
              prompt="Cinematic 16:9 New Orleans Saints CGI. Preserve the ornate black-and-gold pope-like ceremonial figure with the Saints fleur-de-lis on his mitre, cross staff, French Quarter buildings, lanterns, flags and brass musicians. The figure strides forward with dignity as his embroidered cloak billows and the gold cross staff catches lantern light. Gentle camera tracking, soft drifting street fog and subtle brass band movement. Keep faces, insignias, and architecture consistent; no added text."
              ;;
            "Tampa Bay Buccaneers")
              prompt="Epic cinematic 16:9 Tampa Bay Buccaneers CGI. Preserve the massive pirate ship with black-and-red sails, Buccaneers skull-and-swords flags, gilded skull figurehead, lanterns, churning ocean and sunset coastal fort. The ship surges forward through rough waves as white spray crashes over the bow, sails and flags billow and warm lanterns flicker. Dynamic low camera tracking beside the hull. Keep the Buccaneers logos, ship geometry and skull figurehead intact; no added vessels or text."
              ;;
            "New York Jets")
              prompt="Epic cinematic 16:9 Jets F-16 takeoff CGI. Preserve exactly one correctly shaped single-engine single-tail F-16 with Jets markings and the original skyline. Low tracking camera follows acceleration on a wet runway, one afterburner glows, heat haze and runway reflections; aircraft gently lifts off. No additional engines, wings, tails, aircraft, or logo distortion."
              ;;
          esac
          export INPUT_PROMPT="$prompt"
          # Public Wan GPU capacity is shared and occasionally rejects queued requests.
          # Retry every team instead of only Cincinnati, with increasing delays.
          for attempt in 1 2 3 4; do
            echo "Render attempt $attempt of 4 for $SELECTED_TEAM"
            if python scripts/generate_wan_clip.py; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 30))
              echo "Video generation failed; retrying after ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "All 4 generation attempts failed for $SELECTED_TEAM"
          exit 1
      - name: Upload team CGI MP4 or status
        if: ${{ (inputs.teams == 'All teams' || (inputs.teams == 'Cincinnati Bengals only' && matrix.id == 'bengals') || (inputs.teams == 'AFC South only' && (matrix.id == 'texans' || matrix.id == 'colts' || matrix.id == 'jaguars')) || (inputs.teams == 'AFC West only' && (matrix.id == 'broncos' || matrix.id == 'chiefs' || matrix.id == 'raiders' || matrix.id == 'chargers')) || (inputs.teams == 'NFC East only' && (matrix.id == 'cowboys' || matrix.id == 'giants' || matrix.id == 'eagles' || matrix.id == 'commanders')) || (inputs.teams == 'NFC South only' && (matrix.id == 'falcons' || matrix.id == 'panthers' || matrix.id == 'saints' || matrix.id == 'buccaneers'))) && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TMFL-${{ matrix.id }}-CGI
          path: |
            output/*.mp4
            output/status.txt
          if-no-files-found: warn
          retention-days: 7
