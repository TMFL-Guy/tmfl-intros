name: Generate TMFL Bills vs Dolphins CGI
on:
  workflow_dispatch:
    inputs:
      scene_duration:
        description: Clip duration in seconds (0.5 to 4.5)
        required: true
        default: '4.0'
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Animate Bills vs Dolphins showdown
        env:
          INPUT_IMAGE_URL: https://raw.githubusercontent.com/TMFL-Guy/tmfl-intros/main/assets/TMFL_Bills_Dolphins_Runout.png
          INPUT_DURATION: ${{ inputs.scene_duration }}
          INPUT_PROMPT: 'Fast-paced continuous cinematic 16:9 action shot. EXACTLY four Buffalo Bills toy players with jersey numbers 12 Jim Kelly, 14 Stefon Diggs, 17 Josh Allen and 78 Bruce Smith EXPLODE OUT OF THE BLUE BILLS TUNNEL at full running speed. EXACTLY five Miami Dolphins toy players with jersey numbers 1 Tua Tagovailoa, 10 Tyreek Hill, 13 Dan Marino, 28 DeVon Achane and 99 Jason Taylor SPRINT OUT OF THE TEAL DOLPHINS TUNNEL at full running speed. All nine are running, NOT walking, NOT marching, NOT standing still. Powerful rapid strides, vigorous arm pumping, obvious forward displacement over the full shot, quick energetic camera tracking, dramatic motion blur in the background and turf spray at their feet. Keep their miniature TeenyMates toy proportions, accurate jersey numbers and side-only helmet logos. Preserve the same original handmade asymmetrical cardboard TeenyMates Standing Board Stadium, goalpost, stands, crowd, signs and floodlights. No extra players, no duplicate numbers, no added structures, no collisions, no cuts, no text overlays, no sound.'
        run: python scripts/generate_wan_clip.py
      - name: Upload Bills Dolphins CGI MP4 or status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TMFL-Bills-Dolphins-CGI
          path: |
            output/*.mp4
            output/status.txt
          if-no-files-found: warn
          retention-days: 7
