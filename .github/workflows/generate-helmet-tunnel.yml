name: Generate TMFL Helmet Tunnel - Authentic Teams
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering tools
        run: |
          python -m pip install requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render actual helmet images and exact official logo
        run: python scripts/render_authentic_helmets.py
      - name: Upload rendered MP4 or missing-asset report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TMFL-Helmet-Tunnel-CGI
          path: |
            output/*.mp4
            output/status.txt
          if-no-files-found: warn
          retention-days: 7
