name: Generate New York Jets Supersonic Launch
on:
  workflow_dispatch:
    inputs:
      scene_duration:
        description: Clip duration in seconds (0.5 to 4.5)
        required: true
        default: '4.0'
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Animate CGI
        env:
          INPUT_IMAGE_URL: https://raw.githubusercontent.com/TMFL-Guy/tmfl-intros/main/assets/jets.png
          INPUT_DURATION: ${{ inputs.scene_duration }}
          INPUT_PROMPT: 'Epic cinematic 16:9 F-16 runway image-to-video sequence. Preserve the single realistic F-16 aircraft geometry, wings, single tail fin, one engine, Jets markings, skyline and runway. Low rear-quarter tracking camera follows the aircraft accelerating along wet runway with heat shimmer and reflections, landing gear stays mechanically consistent; the afterburner intensifies as the aircraft lifts gently into the air. Do not add aircraft, engines, tails or wings. Preserve Jets logo and all lettering.'
        run: python scripts/generate_wan_clip.py
      - name: Upload MP4 or status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TMFL-AFC-East-jets-CGI
          path: |
            output/*.mp4
            output/status.txt
          if-no-files-found: warn
          retention-days: 7
